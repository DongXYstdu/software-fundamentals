<text x="340" y="276" text-anchor="middle" font-size="9.5" fill="#0C447C" dominant-baseline="central">by-feature · api/internal · package-private · 接口归消费者</text>
<text x="340" y="291" text-anchor="middle" font-size="9" fill="#185FA5" dominant-baseline="central">分割线降维到模块内部 · 用尺子度量 D 值验收</text>
