<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
<title>ThreadPoolExecutor 执行流程</title>
<desc>任务到达→核心线程→队列→非核心线程→拒绝策略，四道缓冲闸</desc>
<defs>
<marker id="arrow12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">ThreadPoolExecutor 执行流程</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">四道缓冲闸：核心→队列→非核心→拒绝</text>
<rect x="40" y="76" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="140" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">任务到达</text>
<text x="140" y="116" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">execute(task)</text>
<line x1="140" y1="132" x2="140" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow12)"/>
<rect x="40" y="148" width="200" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="168" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">core &lt; corePoolSize？</text>
<text x="140" y="188" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">核心线程未满？</text>
<line x1="140" y1="204" x2="140" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow12)"/>
<text x="153" y="212" font-size="10" fill="#5F5E5A" dominant-baseline="central">否</text>
<rect x="40" y="220" width="200" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="240" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">workQueue 未满？</text>
<text x="140" y="260" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">队列有空位？</text>
<line x1="140" y1="276" x2="140" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow12)"/>
<text x="153" y="284" font-size="10" fill="#5F5E5A" dominant-baseline="central">否</text>
<rect x="40" y="292" width="200" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="312" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">thread &lt; maxPoolSize？</text>
<text x="140" y="332" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">还没到上限？</text>
<rect x="440" y="148" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="540" y="168" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">新建核心线程</text>
<text x="540" y="188" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">立即执行</text>
<rect x="440" y="220" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="240" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">入队等待</text>
<text x="540" y="260" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">FIFO 排队</text>
<rect x="440" y="292" width="200" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="312" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">新建非核心线程</text>
<text x="540" y="332" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">空闲超时回收</text>
<line x1="240" y1="176" x2="438" y2="176" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow12)"/>
<text x="335" y="164" text-anchor="middle" font-size="10" fill="#3B6D11" dominant-baseline="central">是</text>
<line x1="240" y1="248" x2="438" y2="248" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow12)"/>
<text x="335" y="236" text-anchor="middle" font-size="10" fill="#185FA5" dominant-baseline="central">是</text>
<line x1="240" y1="320" x2="438" y2="320" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow12)"/>
<text x="335" y="308" text-anchor="middle" font-size="10" fill="#185FA5" dominant-baseline="central">是</text>
<rect x="440" y="364" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="540" y="384" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">执行拒绝策略</text>
<text x="540" y="404" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">见下方四种</text>
<polyline points="140,348 140,392 438,392" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow12)"/>
<text x="153" y="372" font-size="10" fill="#993C1D" dominant-baseline="central">否</text>
<text x="340" y="448" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">核心线程默认按需创建（prestartAllCoreThreads 预热）；非核心线程空闲超 keepAliveTime 回收</text>
</svg>