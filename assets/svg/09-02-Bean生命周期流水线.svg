<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" role="img">
<style>svg{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}</style>
<title>Bean 生命周期：六阶段流水线 + 四个干预点</title>
<desc>实例化、属性注入、Aware 回调、初始化（含 BeanPostProcessor 前后置钩子）、就绪使用、销毁；AOP 代理在后置钩子替换原对象</desc>
<text x="24" y="28" font-size="15" font-weight="500" fill="#2C2C2A">Bean 生命周期六阶段</text>
<rect x="600" y="12" width="12" height="12" rx="4" fill="#FBF3D5" stroke="#9A7B0A"/>
<text x="618" y="22" font-size="10" fill="#5F5E5A">干预点（可插手的位置）</text>

<g><rect x="24" y="52" width="160" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="104" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">① 实例化</text>
<text x="104" y="92" text-anchor="middle" font-size="9.5" fill="#185FA5">构造器创建裸对象</text></g>
<line x1="184" y1="81" x2="214" y2="81" stroke="#5F5E5A" stroke-width="1.2"/>
<g><rect x="216" y="52" width="160" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="296" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">② 属性注入</text>
<text x="296" y="92" text-anchor="middle" font-size="9.5" fill="#185FA5">@Autowired / 构造器依赖填充</text></g>
<line x1="376" y1="81" x2="406" y2="81" stroke="#5F5E5A" stroke-width="1.2"/>
<g><rect x="408" y="52" width="160" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="488" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">③ Aware 回调</text>
<text x="488" y="92" text-anchor="middle" font-size="9.5" fill="#185FA5">注入容器自身引用</text></g>
<line x1="568" y1="81" x2="598" y2="81" stroke="#5F5E5A" stroke-width="1.2"/>
<g><rect x="600" y="52" width="136" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="668" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C">BeanNameAware 等</text>
<text x="668" y="92" text-anchor="middle" font-size="9.5" fill="#185FA5">知道自己是谁</text></g>

<path d="M668 110 V140 H390 V168" stroke="#5F5E5A" stroke-width="1.2" fill="none"/>

<g><rect x="24" y="170" width="712" height="120" rx="10" fill="#FBF3D5" stroke="#9A7B0A" stroke-width="1" stroke-dasharray="5 3"/>
<text x="44" y="192" font-size="12" font-weight="500" fill="#5C4A06">④ 初始化 —— 干预点最密集的区域</text></g>

<g><rect x="44" y="204" width="200" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="144" y="226" text-anchor="middle" font-size="10.5" font-weight="500" fill="#3C3489">postProcessBeforeInitialization</text>
<text x="144" y="244" text-anchor="middle" font-size="9.5" fill="#534AB7">后置处理器·前置钩子</text>
<text x="144" y="258" text-anchor="middle" font-size="9.5" fill="#534AB7">@PostConstruct 在此触发</text></g>
<line x1="244" y1="237" x2="274" y2="237" stroke="#5F5E5A" stroke-width="1.2"/>
<g><rect x="276" y="204" width="180" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="366" y="226" text-anchor="middle" font-size="10.5" font-weight="500" fill="#0C447C">InitializingBean</text>
<text x="366" y="244" text-anchor="middle" font-size="9.5" fill="#185FA5">afterPropertiesSet()</text>
<text x="366" y="258" text-anchor="middle" font-size="9.5" fill="#185FA5">自定义 init-method</text></g>
<line x1="456" y1="237" x2="486" y2="237" stroke="#5F5E5A" stroke-width="1.2"/>
<g><rect x="488" y="204" width="228" height="66" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="602" y="226" text-anchor="middle" font-size="10.5" font-weight="500" fill="#4A1B0C">postProcessAfterInitialization</text>
<text x="602" y="244" text-anchor="middle" font-size="9.5" fill="#993C1D">后置处理器·后置钩子</text>
<text x="602" y="258" text-anchor="middle" font-size="9.5" fill="#993C1D">★ AOP 代理在这里替换原对象</text></g>

<path d="M380 290 V320" stroke="#5F5E5A" stroke-width="1.2" fill="none"/>
<g><rect x="280" y="322" width="200" height="58" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="380" y="344" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A">⑤ 就绪使用</text>
<text x="380" y="362" text-anchor="middle" font-size="9.5" fill="#3B6D11">放入单例池，供 getBean 取用</text></g>
<path d="M380 380 V410" stroke="#5F5E5A" stroke-width="1.2" fill="none"/>
<g><rect x="280" y="412" width="200" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="380" y="434" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">⑥ 销毁</text>
<text x="380" y="452" text-anchor="middle" font-size="9.5" fill="#185FA5">@PreDestroy → DisposableBean</text></g>

<g><rect x="520" y="322" width="216" height="58" rx="8" fill="#FBF3D5" stroke="#9A7B0A" stroke-width="1" stroke-dasharray="5 3"/>
<text x="628" y="344" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5C4A06">干预点汇总</text>
<text x="628" y="362" text-anchor="middle" font-size="9.5" fill="#5C4A06">① 实例化后 ② 注入后 ③ 初始化前后 ④ 销毁前</text></g>

<rect x="24" y="492" width="712" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="380" y="512" text-anchor="middle" font-size="11" fill="#27500A">@PostConstruct 在「前置钩子」触发，此时 ② 属性注入已完成 —— 所以它能安全使用注入的依赖</text>
<text x="380" y="530" text-anchor="middle" font-size="11" fill="#27500A">而 AOP 代理在「后置钩子」生成 —— 所以从单例池取出的 Bean 往往已经不是原始对象，而是代理</text>
</svg>
