<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="100%" role="img">
<title>逃逸分析决策路径</title>
<desc>不逃逸的对象标量替换进栈帧，堆里没有这个对象；逃逸对象走正常堆分配分代流转</desc>
<defs>
<marker id="arrow6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">逃逸分析：这个对象到底进不进堆？</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">逃了就按老规矩堆分配；没逃，堆里根本不会有它</text>
<rect x="250" y="66" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="88" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">new Point(x, y)</text>
<line x1="340" y1="110" x2="340" y2="134" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow6)"/>
<rect x="270" y="136" width="140" height="44" rx="8" fill="#185FA5"/>
<text x="340" y="158" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF" dominant-baseline="central">逃逸了吗？</text>
<polyline points="270,158 150,158 150,216" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow6)"/>
<text x="205" y="146" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">不逃逸</text>
<polyline points="410,158 530,158 530,216" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow6)"/>
<text x="475" y="146" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">逃逸</text>
<rect x="40" y="218" width="220" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="150" y="240" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">标量替换</text>
<text x="150" y="258" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">对象拆成基本类型放栈帧/寄存器</text>
<text x="150" y="276" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">堆里根本没有这个对象</text>
<rect x="420" y="218" width="220" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="530" y="240" text-anchor="middle" font-size="13" font-weight="500" fill="#4A1B0C" dominant-baseline="central">逃逸三途径</text>
<text x="530" y="258" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">返回值 · 存进字段 · 传给外部方法</text>
<text x="530" y="276" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">赋给静态变量/共享结构</text>
<line x1="150" y1="288" x2="150" y2="326" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow6)"/>
<line x1="530" y1="288" x2="530" y2="326" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow6)"/>
<rect x="40" y="328" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="150" y="348" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">零 GC 压力</text>
<text x="150" y="366" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">分代流转对它不适用</text>
<rect x="420" y="328" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="530" y="348" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">正常堆分配</text>
<text x="530" y="366" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">走 Eden → Old 分代流转</text>
<text x="340" y="416" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">锁消除也在这一步：不逃逸 → 对象的锁没人争 → synchronized 直接删</text>
<text x="340" y="438" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">实战含义：临时对象用完即弃别外传；日志字符串拼完传给 logger 就算逃逸</text>
</svg>