<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" role="img">
<title>JVM 执行引擎分层编译</title>
<desc>解释器起步，热点代码经 C1 轻优化，最终由 C2 激进优化；C2 三板斧是内联、逃逸分析、锁消除</desc>
<defs>
<marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">执行引擎：代码越热，优化越狠</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">解释器起步 → C1 轻优化 → C2 激进优化（分层编译，JDK 8+ 默认开启）</text>
<rect x="40" y="76" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="90" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">字节码</text>
<text x="90" y="112" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">.class</text>
<rect x="170" y="76" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="240" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">解释执行</text>
<text x="240" y="112" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">逐条翻译 · 启动快</text>
<rect x="340" y="76" width="140" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="410" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">C1 编译</text>
<text x="410" y="112" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">轻优化 · 短编译</text>
<rect x="510" y="76" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="575" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">C2 编译</text>
<text x="575" y="112" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">激进优化 · 极致</text>
<line x1="140" y1="104" x2="168" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow5)"/>
<text x="154" y="92" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">加载</text>
<line x1="310" y1="104" x2="338" y2="104" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow5)"/>
<text x="324" y="92" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">热点</text>
<line x1="480" y1="104" x2="508" y2="104" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow5)"/>
<text x="494" y="92" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">更热</text>
<text x="240" y="148" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">方法计数 ~1.5k 次</text>
<text x="410" y="148" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">循环回边+调用 ~10k 次</text>
<rect x="150" y="176" width="150" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="225" y="196" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">方法内联</text>
<text x="225" y="214" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">小方法展开进调用方</text>
<text x="225" y="230" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">一切优化之母</text>
<rect x="320" y="176" width="150" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="395" y="196" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">逃逸分析</text>
<text x="395" y="214" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">对象跑没跑出方法</text>
<text x="395" y="230" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">C2 的灵魂拷问</text>
<rect x="490" y="176" width="150" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="565" y="196" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">锁消除</text>
<text x="565" y="214" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">局部对象的锁直接删</text>
<text x="565" y="230" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">如局部 StringBuffer</text>
<polyline points="575,132 575,158 225,158 225,174" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
<polyline points="395,158 395,174" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
<polyline points="565,158 565,174" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="340" y="272" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">触发靠两个计数器：方法调用计数器 + 循环回边计数器（-XX:CompileThreshold 在分层模式下仅参考值）</text>
</svg>