<text x="130" y="520" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">DiscardOldest</text>
<rect x="220" y="504" width="220" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="520" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">丢队首（最早）</text>
