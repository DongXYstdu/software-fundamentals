<text x="330" y="392" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">行为</text>
<rect x="440" y="376" width="200" height="32" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="540" y="392" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">适用</text>
