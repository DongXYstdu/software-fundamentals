<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" role="img">
<title>SOLID 五原则指向变化隔离</title>
<desc>五条原则从不同方向服务同一目标：把变化隔离在尽可能小的范围内</desc>
<defs>
<marker id="arrow901" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">SOLID 五原则：五条路，同一个终点——隔离变化</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">判断标准：下次同类变化，需要改几个地方？改得越少越集中，结构越好</text>
<rect x="240" y="140" width="200" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="164" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">隔离变化</text>
<text x="340" y="184" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">改动被限制在局部，不沿依赖链扩散</text>
<rect x="40" y="60" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="78" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">SRP 单一职责</text>
<text x="115" y="96" text-anchor="middle" font-size="10.5" fill="#5F5E5A" dominant-baseline="central">隔离多个变化轴挤一类</text>
<rect x="40" y="236" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="254" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">OCP 开闭</text>
<text x="115" y="272" text-anchor="middle" font-size="10.5" fill="#5F5E5A" dominant-baseline="central">隔离新增类型对老码的修改</text>
<rect x="490" y="60" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="565" y="78" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">ISP 接口隔离</text>
<text x="565" y="96" text-anchor="middle" font-size="10.5" fill="#5F5E5A" dominant-baseline="central">隔离无用方法变更的波及</text>
<rect x="490" y="236" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="565" y="254" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">DIP 依赖倒置</text>
<text x="565" y="272" text-anchor="middle" font-size="10.5" fill="#5F5E5A" dominant-baseline="central">隔离底层更换对高层的影响</text>
<rect x="265" y="272" width="150" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">LSP 里氏替换</text>
<text x="340" y="308" text-anchor="middle" font-size="10.5" fill="#4A1B0C" dominant-baseline="central">隔离替换实现带来的行为意外</text>
<line x1="190" y1="84" x2="238" y2="146" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow901)"/>
<line x1="190" y1="260" x2="238" y2="198" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow901)"/>
<line x1="490" y1="84" x2="442" y2="146" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow901)"/>
<line x1="490" y1="260" x2="442" y2="198" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow901)"/>
<line x1="340" y1="272" x2="340" y2="206" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arrow901)"/>
<text x="340" y="334" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">应用粒度：类内（SRP）→ 包内（ISP）→ 层间（DIP）→ 模块间（10–11 课）</text>
</svg>
