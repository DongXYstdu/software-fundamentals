<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" role="img">
<title>六边形端口适配器全景</title>
<desc>网关南北向流量：REST/MQTT/定时器驱动侧，DB/Kafka/Modbus 被驱动侧；亮点：时钟是 actor，Modbus 拆两半</desc>
<defs>
<marker id="arrow1202" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">网关六边形全景：南北向流量与时钟 actor</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">判据只有一个：谁发起，谁就是驱动侧 —— Modbus 主从协议下，"读设备"的发起者是时间</text>
<text x="105" y="86" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">驱动侧（左）：谁在敲应用的门</text>
<rect x="24" y="100" width="164" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="106" y="114" text-anchor="middle" font-size="9.5" fill="#0C447C" dominant-baseline="central">RestRuleConfigAdapter</text>
<text x="106" y="129" text-anchor="middle" font-size="9" fill="#185FA5" dominant-baseline="central">配置页（人）</text>
<rect x="24" y="152" width="164" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="106" y="166" text-anchor="middle" font-size="9.5" fill="#0C447C" dominant-baseline="central">MqttControlAdapter</text>
<text x="106" y="181" text-anchor="middle" font-size="9" fill="#185FA5" dominant-baseline="central">平台下发（平台）</text>
<rect x="24" y="204" width="164" height="46" rx="6" fill="#E6F1FB" stroke="#0C447C" stroke-width="1.6"/>
<text x="106" y="218" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0C447C" dominant-baseline="central">★ PollingScheduler（哑定时器）</text>
<text x="106" y="234" text-anchor="middle" font-size="9" fill="#185FA5" dominant-baseline="central">采集触发（时钟 = actor）</text>
<text x="106" y="270" text-anchor="middle" font-size="9" fill="#5F5E5A" dominant-baseline="central">@Scheduled 只留最小分辨率</text>
<text x="106" y="284" text-anchor="middle" font-size="9" fill="#5F5E5A" dominant-baseline="central">频率表 PollingPlan 在内核</text>
<line x1="188" y1="120" x2="248" y2="140" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow1202)"/>
<line x1="188" y1="172" x2="248" y2="180" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow1202)"/>
<line x1="188" y1="227" x2="248" y2="220" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow1202)"/>
<rect x="250" y="96" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.6"/>
<text x="340" y="113" text-anchor="middle" font-size="9" fill="#0C447C" dominant-baseline="central">RuleConfigUseCase ◄驱动端口</text>
<rect x="250" y="164" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.6"/>
<text x="340" y="181" text-anchor="middle" font-size="9" fill="#0C447C" dominant-baseline="central">ControlUseCase ◄驱动端口</text>
<rect x="250" y="204" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.6"/>
<text x="340" y="221" text-anchor="middle" font-size="9" fill="#0C447C" dominant-baseline="central">PollDevicesUseCase ◄驱动端口</text>
<rect x="246" y="128" width="188" height="118" rx="0" fill="none" stroke="none"/>
<rect x="244" y="86" width="192" height="156" rx="10" fill="#EAF3EC" stroke="#3B6D11" stroke-width="1.2"/>
<rect x="250" y="96" width="180" height="142" rx="6" fill="#EAF3EC" stroke="none"/>
<text x="340" y="252" text-anchor="middle" font-size="9.5" fill="#1F3D0A" dominant-baseline="central">应用层：用例编排（薄）+ 全部端口定义</text>
<text x="340" y="270" text-anchor="middle" font-size="9.5" fill="#1F3D0A" dominant-baseline="central">领域层：AlarmRule · PollingPlan</text>
<text x="340" y="288" text-anchor="middle" font-size="9.5" fill="#1F3D0A" dominant-baseline="central">DeviceSnapshot · AlarmRecord</text>
<text x="340" y="308" text-anchor="middle" font-size="9.5" font-weight="500" fill="#3B6D11" dominant-baseline="central">▲ 所有箭头指向内核 ▲</text>
<text x="576" y="86" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">被驱动侧（右）：替内核打工</text>
<rect x="492" y="100" width="164" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/>
<text x="574" y="114" text-anchor="middle" font-size="9.5" fill="#444441" dominant-baseline="central">KafkaAlarmSink</text>
<text x="574" y="129" text-anchor="middle" font-size="9" fill="#5F5E5A" dominant-baseline="central">实现 AlarmSink</text>
<rect x="492" y="152" width="164" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/>
<text x="574" y="166" text-anchor="middle" font-size="9.5" fill="#444441" dominant-baseline="central">MyBatis/TDengine 适配器</text>
<text x="574" y="181" text-anchor="middle" font-size="9" fill="#5F5E5A" dominant-baseline="central">实现 Repository/Writer</text>
<rect x="492" y="204" width="164" height="46" rx="6" fill="#F1EFE8" stroke="#444441" stroke-width="1.6"/>
<text x="574" y="218" text-anchor="middle" font-size="9.5" font-weight="500" fill="#444441" dominant-baseline="central">★ ModbusDeviceAdapter</text>
<text x="574" y="234" text-anchor="middle" font-size="9" fill="#5F5E5A" dominant-baseline="central">实现 SnapshotReader/Writer</text>
<line x1="656" y1="120" x2="596" y2="140" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow1202)"/>
<line x1="492" y1="172" x2="438" y2="180" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow1202)"/>
<line x1="492" y1="227" x2="438" y2="220" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow1202)"/>
<rect x="120" y="336" width="440" height="58" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="352" text-anchor="middle" font-size="10.5" font-weight="500" fill="#0C447C" dominant-baseline="central">★ 亮点：Modbus 被拆成两半</text>
<text x="340" y="370" text-anchor="middle" font-size="9.5" fill="#444441" dominant-baseline="central">定时器（驱动侧·左下，时钟发起）＋ 协议访问（被驱动侧·右下，被动应答）</text>
<text x="340" y="386" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">若设备换 MQTT 直连上报（设备主动推）→ 整体移到驱动侧，判据仍是"谁发起"</text>
<text x="340" y="416" text-anchor="middle" font-size="10" fill="#5F5E5A" dominant-baseline="central">驱动 actor：人 · 平台 · 时钟 ｜ 被驱动技术：DB · 时序库 · Kafka · Modbus 协议访问</text>
</svg>
