<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="100%" role="img">
<title>synchronized vs ReentrantLock 选型</title>
<desc>对比使用方式、公平性、可中断、超时、条件变量、释放方式六个维度</desc>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">synchronized vs ReentrantLock：怎么选</text>
<rect x="40" y="76" width="180" height="40" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">维度</text>
<rect x="220" y="76" width="220" height="40" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">synchronized</text>
<rect x="440" y="76" width="200" height="40" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="540" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">ReentrantLock</text>
<rect x="40" y="116" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="136" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">使用方式</text>
<rect x="220" y="116" width="220" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="136" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">关键字 · 自动释放</text>
<rect x="440" y="116" width="200" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="540" y="136" text-anchor="middle" font-size="11" fill="#3C3489" dominant-baseline="central">API · 必须 finally unlock</text>
<rect x="40" y="156" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="176" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">公平性</text>
<rect x="220" y="156" width="220" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="176" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">非公平（不可选）</text>
<rect x="440" y="156" width="200" height="40" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="540" y="176" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">可选公平/非公平</text>
<rect x="40" y="196" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="216" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">可中断</text>
<rect x="220" y="196" width="220" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="330" y="216" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">✗ 不可</text>
<rect x="440" y="196" width="200" height="40" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="540" y="216" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">✓ lockInterruptibly</text>
<rect x="40" y="236" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="256" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">超时获取</text>
<rect x="220" y="236" width="220" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="330" y="256" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">✗ 不可</text>
<rect x="440" y="236" width="200" height="40" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="540" y="256" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">✓ tryLock(timeout)</text>
<rect x="40" y="276" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="296" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">条件变量</text>
<rect x="220" y="276" width="220" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="330" y="296" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">单 wait/notify</text>
<rect x="440" y="276" width="200" height="40" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="540" y="296" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">多个 Condition</text>
<rect x="40" y="316" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="336" text-anchor="middle" font-size="11" fill="#444441" dominant-baseline="central">异常时释放</text>
<rect x="220" y="316" width="220" height="40" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="330" y="336" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">✓ 自动</text>
<rect x="440" y="316" width="200" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="540" y="336" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">✗ 漏 unlock 就死锁</text>
<text x="340" y="380" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">选型口诀：能用 synchronized 就用；要可中断/超时/多条件/公平才换 ReentrantLock</text>
</svg>