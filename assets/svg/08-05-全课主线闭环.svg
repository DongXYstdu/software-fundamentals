<rect x="40" y="182" width="180" height="76" rx="8" fill="#EAF3EC" stroke="#136C43" stroke-width="0.5"/>
<text x="130" y="202" text-anchor="middle" font-size="12" font-weight="500" fill="#136C43" dominant-baseline="central">6 总结与进阶</text>
<text x="130" y="222" text-anchor="middle" font-size="11" fill="#136C43" dominant-baseline="central">运维 · 版本策略 · 演进</text>
<text x="130" y="240" text-anchor="middle" font-size="11" fill="#136C43" dominant-baseline="central">双模块 · CI · 测试</text>
</g>
<g>
<rect x="40" y="290" width="612" height="140" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="54" y="314" font-size="13" font-weight="500" fill="#2C2C2A">三个最重要的认知</text>
<text x="54" y="342" font-size="11" fill="#444441">1. 自动装配 = 发现（imports）+ 条件（@ConditionalOnXxx）+ 注册（@EnableConfigurationProperties + @Bean）</text>
<text x="54" y="366" font-size="11" fill="#444441">2. 发版 = 五条校验的兑现：元信息 · sources · javadoc · GPG 签名 · 命名空间，pom 无多余配置</text>
<text x="54" y="390" font-size="11" fill="#444441">3. 发布不可撤回 + autoPublish=false 人工闸：Validated 到 Release 之间是最后的 Drop 反悔机会</text>
<text x="54" y="414" font-size="11" fill="#8A8880">版本基线：Boot 3.5.16 · central-publishing 0.11.0 · gpg-plugin 3.2.8（2026-08 查证）</text>
</g>
</svg>
