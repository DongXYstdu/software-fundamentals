<polygon points="246,104 254,108 246,112" fill="#5F5E5A"/>
<g>
<rect x="256" y="70" width="180" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="346" y="90" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">2 环境准备</text>
<text x="346" y="110" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">Token · 命名空间 · GPG</text>
<text x="346" y="128" text-anchor="middle" font-size="11" fill="#378ADD" dominant-baseline="central">settings.xml 凭证</text>
</g>
<line x1="436" y1="108" x2="462" y2="108" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="462,104 470,108 462,112" fill="#5F5E5A"/>
<g>
<rect x="472" y="70" width="180" height="76" rx="8" fill="#185FA5"/>
<text x="562" y="90" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF" dominant-baseline="central">3 Starter 本体</text>
<text x="562" y="110" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.85" dominant-baseline="central">属性 → 组件 → 装配 → 注册</text>
<text x="562" y="128" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.85" dominant-baseline="central">自动装配是灵魂</text>
</g>
<line x1="562" y1="146" x2="562" y2="172" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="558,172 562,180 566,172" fill="#5F5E5A"/>
