<text x="562" y="222" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">五校验逐一兑现</text>
<text x="562" y="240" text-anchor="middle" font-size="11" fill="#7F77DD" dominant-baseline="central">release profile 四插件</text>
</g>
<line x1="472" y1="220" x2="446" y2="220" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="446,216 438,220 446,224" fill="#5F5E5A"/>
<g>
<rect x="256" y="182" width="180" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="346" y="202" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">5 发布与验证</text>
<text x="346" y="222" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">deploy → Validated → Release</text>
<text x="346" y="240" text-anchor="middle" font-size="11" fill="#7F77DD" dominant-baseline="central">BUILD SUCCESS ≠ 已发布</text>
</g>
<line x1="256" y1="220" x2="230" y2="220" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="230,216 222,220 230,224" fill="#5F5E5A"/>
