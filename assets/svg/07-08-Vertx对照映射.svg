<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" role="img">
<title>Netty 与 Vert.x 对照映射</title>
<desc>EventLoopGroup 对 Vertx 实例、EventLoop 对 Event Loop、Channel 加 Pipeline 对 NetServer 回调链、业务线程池对 executeBlocking</desc>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">Netty ↔ Vert.x 对照映射</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A">Vert.x 的事件循环就是 Netty EventLoop 的直接封装</text>
<rect x="40" y="70" width="290" height="36" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="185" y="92" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Netty（本课）</text>
<rect x="350" y="70" width="290" height="36" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="495" y="92" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Vert.x（你的网关）</text>
<rect x="40" y="112" width="290" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="134" text-anchor="middle" font-size="11" fill="#0C447C">EventLoopGroup（事件循环池）</text>
<rect x="350" y="112" width="290" height="36" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="495" y="134" text-anchor="middle" font-size="11" fill="#27500A">Vertx 实例（默认同为 2×CPU）</text>
<rect x="40" y="152" width="290" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="174" text-anchor="middle" font-size="11" fill="#0C447C">EventLoop（1线程+1Selector+1队列）</text>
<rect x="350" y="152" width="290" height="36" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="495" y="174" text-anchor="middle" font-size="11" fill="#27500A">Event Loop（底层即 Netty）</text>
<rect x="40" y="192" width="290" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="214" text-anchor="middle" font-size="11" fill="#0C447C">Channel + Pipeline（Handler 链）</text>
<rect x="350" y="192" width="290" height="36" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="495" y="214" text-anchor="middle" font-size="11" fill="#27500A">NetServer + connect/body 回调链</text>
<rect x="40" y="232" width="290" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="254" text-anchor="middle" font-size="11" fill="#0C447C">提交业务线程池（手动管理）</text>
<rect x="350" y="232" width="290" height="36" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="495" y="254" text-anchor="middle" font-size="11" fill="#27500A">executeBlocking / Worker Verticle</text>
<text x="340" y="290" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A">黄金法则同源：绝不阻塞事件循环 —— 根源都是 Channel 与 EventLoop 终身绑定</text>
</svg>
