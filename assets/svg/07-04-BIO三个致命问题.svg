<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" role="img">
<title>BIO 的三个致命问题</title>
<desc>线程与连接一对一绑定、read 阻塞冻结线程、上下文切换吃掉 CPU</desc>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">BIO 的三个致命问题</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A">瓶颈不是 CPU 算力，而是线程数量</text>
<rect x="40" y="70" width="190" height="120" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="135" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">① 线程与连接 1:1</text>
<text x="135" y="116" text-anchor="middle" font-size="11" fill="#993C1D">1000 设备 = 1000 线程</text>
<text x="135" y="134" text-anchor="middle" font-size="11" fill="#993C1D">默认栈 1MB/线程</text>
<text x="135" y="152" text-anchor="middle" font-size="11" fill="#993C1D">光栈内存约 1GB</text>
<text x="135" y="174" text-anchor="middle" font-size="10" fill="#B4654A">上报稀疏 → 利用率极低</text>
<rect x="245" y="70" width="190" height="120" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">② read() 阻塞</text>
<text x="340" y="116" text-anchor="middle" font-size="11" fill="#993C1D">数据没到 → 线程挂起</text>
<text x="340" y="134" text-anchor="middle" font-size="11" fill="#993C1D">期间无法服务其他连接</text>
<text x="340" y="152" text-anchor="middle" font-size="11" fill="#993C1D">活着但毫无产出</text>
<text x="340" y="174" text-anchor="middle" font-size="10" fill="#B4654A">阻塞点 = 连接数</text>
<rect x="450" y="70" width="190" height="120" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="545" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">③ 上下文切换</text>
<text x="545" y="116" text-anchor="middle" font-size="11" fill="#993C1D">线程多 → 切换开销大</text>
<text x="545" y="134" text-anchor="middle" font-size="11" fill="#993C1D">CPU 时间花在调度等待</text>
<text x="545" y="152" text-anchor="middle" font-size="11" fill="#993C1D">而非干活</text>
<text x="545" y="174" text-anchor="middle" font-size="10" fill="#B4654A">连接多但 CPU 不高</text>
<rect x="40" y="214" width="600" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="238" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">突破方向：让少量线程同时照看大量连接</text>
<text x="340" y="258" text-anchor="middle" font-size="11" fill="#185FA5">→ 下一站：NIO Selector 多路复用（阻塞点从连接数收敛为 1）</text>
</svg>
