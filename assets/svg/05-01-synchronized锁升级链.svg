<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="100%" role="img">
<title>synchronized 锁升级链</title>
<desc>无锁→偏向锁→轻量级锁→重量级锁，升级不可逆；竞争越激烈锁越重</desc>
<defs>
<marker id="arrow10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">synchronized 锁升级：越竞争越重，且不可逆</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">JDK 6+ 引入，JIT 根据竞争情况自动选档</text>
<rect x="40" y="80" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="106" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">无锁</text>
<text x="106" y="118" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">对象头正常</text>
<rect x="188" y="80" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="254" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">偏向锁</text>
<text x="254" y="118" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">单线程 · 存 ThreadID</text>
<rect x="336" y="80" width="132" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="402" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">轻量级锁</text>
<text x="402" y="118" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">CAS 自旋</text>
<rect x="484" y="80" width="132" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="550" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">重量级锁</text>
<text x="550" y="118" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">OS 互斥量 · 阻塞</text>
<line x1="172" y1="108" x2="186" y2="108" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow10)"/>
<text x="179" y="96" text-anchor="middle" font-size="10" fill="#3B6D11" dominant-baseline="central">首访</text>
<line x1="320" y1="108" x2="334" y2="108" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow10)"/>
<text x="327" y="96" text-anchor="middle" font-size="10" fill="#185FA5" dominant-baseline="central">第二线程</text>
<line x1="468" y1="108" x2="482" y2="108" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow10)"/>
<text x="475" y="96" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">自旋失败</text>
<text x="340" y="170" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">成本：无锁 ≈ 偏向锁（几乎零） &lt; 轻量级锁（自旋耗 CPU） &lt; 重量级锁（线程阻塞·上下文切换）</text>
<text x="340" y="194" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">升级不可逆——一旦升到重量级锁，后续即使无竞争也是重量级（直到 GC 重建对象头）</text>
<text x="340" y="222" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" dominant-baseline="central">JDK 15+ 偏向锁默认关闭（-XX:+UseBiasedLocking 才开）</text>
<text x="340" y="246" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">实战：低竞争场景 synchronized 比想象的轻；高竞争场景优先用 JUC 锁（AQS）</text>
</svg>