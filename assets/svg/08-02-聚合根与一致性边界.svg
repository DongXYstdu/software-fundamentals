<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" role="img">
<title>聚合根与一致性边界</title>
<desc>聚合是事务和一致性边界，外部只能通过聚合根访问内部实体和值对象</desc>
<defs>
<marker id="arrow15" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">聚合：一致性的边界</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">外部只通过聚合根访问 · 事务边界 = 聚合边界</text>
<rect x="40" y="80" width="460" height="220" rx="12" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="6 4"/>
<text x="80" y="100" font-size="11" fill="#534AB7" dominant-baseline="central">订单聚合</text>
<rect x="240" y="100" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="120" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">Order 聚合根</text>
<text x="340" y="138" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">外部唯一入口</text>
<rect x="80" y="200" width="180" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="170" y="220" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">OrderItem 实体</text>
<text x="170" y="238" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">经 Order.addItem 操作</text>
<rect x="320" y="200" width="160" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="400" y="220" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">Address / Money</text>
<text x="400" y="238" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">值对象·不可变</text>
<line x1="340" y1="156" x2="200" y2="198" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow15)"/>
<line x1="340" y1="156" x2="380" y2="198" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow15)"/>
<rect x="540" y="100" width="100" height="120" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="590" y="120" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">外部代码</text>
<text x="590" y="140" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">只持有</text>
<text x="590" y="156" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">Order 引用</text>
<text x="590" y="184" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">⚠ 禁止直连</text>
<text x="590" y="200" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">OrderItem</text>
<line x1="540" y1="128" x2="442" y2="128" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow15)"/>
<text x="490" y="116" text-anchor="middle" font-size="10" fill="#3B6D11" dominant-baseline="central">唯一入口</text>
<text x="270" y="330" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">事务边界 = 聚合边界：一次事务只加载/持久化一个聚合</text>
<text x="270" y="350" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">跨聚合协作用领域事件（最终一致），不强求强一致事务</text>
</svg>