<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img">
<title>EventLoop 任务队列机制</title>
<desc>业务线程通过 execute 或 schedule 把任务投入 MPSC 队列；EventLoop 循环依次 select、处理 IO、runAllTasks</desc>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">EventLoop 任务队列机制</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A">任务队列 = 跨线程协作的唯一入口（其他线程不直接碰 Channel）</text>
<rect x="40" y="70" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="88" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">业务线程 A</text>
<text x="115" y="104" text-anchor="middle" font-size="10" fill="#185FA5">调 writeAndFlush</text>
<rect x="40" y="130" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="148" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">业务线程 B</text>
<text x="115" y="164" text-anchor="middle" font-size="10" fill="#185FA5">调 schedule()</text>
<line x1="190" y1="92" x2="244" y2="110" stroke="#5F5E5A" stroke-width="1"/>
<line x1="190" y1="152" x2="244" y2="134" stroke="#5F5E5A" stroke-width="1"/>
<text x="217" y="88" text-anchor="middle" font-size="9" fill="#5F5E5A">execute()</text>
<text x="217" y="166" text-anchor="middle" font-size="9" fill="#5F5E5A">schedule()</text>
<rect x="244" y="86" width="170" height="88" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="329" y="108" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">MPSC 任务队列</text>
<rect x="258" y="118" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="278" y="134" text-anchor="middle" font-size="10" fill="#534AB7">t1</text>
<rect x="306" y="118" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="326" y="134" text-anchor="middle" font-size="10" fill="#534AB7">t2</text>
<rect x="354" y="118" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="374" y="134" text-anchor="middle" font-size="10" fill="#534AB7">t3</text>
<text x="329" y="162" text-anchor="middle" font-size="9" fill="#534AB7">多生产者（CAS 无锁）· 单消费者</text>
<line x1="414" y1="130" x2="450" y2="130" stroke="#534AB7" stroke-width="1.2"/>
<text x="432" y="122" text-anchor="middle" font-size="9" fill="#534AB7">取空</text>
<rect x="450" y="70" width="190" height="240" rx="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="462" y="92" font-size="12" font-weight="500" fill="#444441">EventLoop 循环 · for(;;)</text>
<rect x="466" y="104" width="158" height="44" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="545" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">select()</text>
<text x="545" y="138" text-anchor="middle" font-size="9" fill="#5F5E5A">轮询 IO 事件</text>
<line x1="545" y1="148" x2="545" y2="164" stroke="#5F5E5A" stroke-width="1"/>
<rect x="466" y="164" width="158" height="44" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="545" y="182" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">处理 IO 事件</text>
<text x="545" y="198" text-anchor="middle" font-size="9" fill="#5F5E5A">读写与 Pipeline 回调</text>
<line x1="545" y1="208" x2="545" y2="224" stroke="#5F5E5A" stroke-width="1"/>
<rect x="466" y="224" width="158" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="545" y="242" text-anchor="middle" font-size="11" font-weight="500" fill="#27500A">runAllTasks()</text>
<text x="545" y="258" text-anchor="middle" font-size="9" fill="#3B6D11">执行队列任务</text>
<line x1="624" y1="246" x2="646" y2="246" stroke="#5F5E5A" stroke-width="1"/>
<line x1="646" y1="246" x2="646" y2="126" stroke="#5F5E5A" stroke-width="1"/>
<line x1="646" y1="126" x2="628" y2="126" stroke="#5F5E5A" stroke-width="1"/>
<text x="545" y="294" text-anchor="middle" font-size="9" fill="#5F5E5A">同一线程串行 → 免锁根源</text>
<rect x="40" y="330" width="600" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="352" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C">ioRatio（默认 50）：IO 与任务时间各占一半；调高 → 任务跑更久但拖慢 IO</text>
<text x="340" y="370" text-anchor="middle" font-size="11" fill="#185FA5">堆积排查用 pendingTasks()；writeAndFlush 线程安全 = 把操作投递回 EventLoop 执行（非加锁）</text>
<text x="340" y="386" text-anchor="middle" font-size="10" fill="#5F5E5A">Vert.x 对应：execute ↔ runOnContext · schedule ↔ setTimer/setPeriodic</text>
</svg>
