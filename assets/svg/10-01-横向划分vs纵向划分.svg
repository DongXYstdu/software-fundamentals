<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
<title>横向划分 vs 纵向划分</title>
<desc>同一需求"加一条告警规则"：横向划分动 4 个模块，纵向划分只动 1 个模块</desc>
<defs>
<marker id="arrow1001" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">模块边界要与变化轴平行：同一需求，动几个模块？</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">需求：给空压机加一条"排气温度连续 3 分钟超 80℃"的告警规则</text>
<rect x="30" y="64" width="300" height="30" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="180" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">❌ 横向划分（按技术层）：动 4 个模块</text>
<rect x="50" y="108" width="260" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="180" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="#4A1B0C" dominant-baseline="central">gateway-web（所有 Controller）</text>
<text x="180" y="138" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">① 新增规则配置接口</text>
<rect x="50" y="156" width="260" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="180" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#4A1B0C" dominant-baseline="central">gateway-service（所有业务）</text>
<text x="180" y="186" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">② 规则判断 + 3 分钟窗口状态</text>
<rect x="50" y="204" width="260" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="180" y="218" text-anchor="middle" font-size="11" font-weight="500" fill="#4A1B0C" dominant-baseline="central">gateway-dao（所有 Mapper）</text>
<text x="180" y="234" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">③ 规则持久化</text>
<rect x="50" y="252" width="260" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="180" y="266" text-anchor="middle" font-size="11" font-weight="500" fill="#4A1B0C" dominant-baseline="central">gateway-common（所有公共类）</text>
<text x="180" y="282" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">④ 告警常量</text>
<text x="180" y="316" text-anchor="middle" font-size="10.5" fill="#993C1D" dominant-baseline="central">改动横穿 4 个模块 · 告警代码继续与 300 个无关类混居</text>
<rect x="350" y="64" width="300" height="30" rx="6" fill="#EAF3EC" stroke="#3B6D11" stroke-width="0.5"/>
<text x="500" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#1F3D0A" dominant-baseline="central">✅ 纵向划分（按业务能力）：只动 1 个模块</text>
<rect x="368" y="108" width="82" height="120" rx="6" fill="#EAF3EC" stroke="#3B6D11" stroke-width="1"/>
<text x="409" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="#1F3D0A" dominant-baseline="central">告警模块</text>
<text x="409" y="146" text-anchor="middle" font-size="9.5" fill="#1F3D0A" dominant-baseline="central">① 配置接口</text>
<text x="409" y="164" text-anchor="middle" font-size="9.5" fill="#1F3D0A" dominant-baseline="central">② 规则判断</text>
<text x="409" y="182" text-anchor="middle" font-size="9.5" fill="#1F3D0A" dominant-baseline="central">③ 持久化</text>
<text x="409" y="206" text-anchor="middle" font-size="9.5" fill="#3B6D11" dominant-baseline="central">全在自己模块内</text>
<rect x="462" y="108" width="82" height="120" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="503" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">设备模块</text>
<text x="503" y="172" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">无感</text>
<rect x="556" y="108" width="82" height="120" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="597" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">能耗模块</text>
<text x="597" y="172" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">无感</text>
<rect x="368" y="252" width="270" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="503" y="266" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">domain-core（契约模型）</text>
<text x="503" y="282" text-anchor="middle" font-size="9.5" fill="#0C447C" dominant-baseline="central">④ 只读 DeviceSnapshot，不修改</text>
<text x="500" y="316" text-anchor="middle" font-size="10.5" fill="#3B6D11" dominant-baseline="central">设备/能耗模块不用重新编译 · 变化完整落在一个模块内</text>
<text x="340" y="352" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" dominant-baseline="central">几何直觉：横向划分 → 需求变化轴 ⟂ 模块边界（每次横穿）；纵向划分 → 变化轴 ∥ 边界（完整落入）</text>
<text x="340" y="376" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">横向的合法领地只剩纯技术组件（common / starter / 驱动适配层）</text>
</svg>
