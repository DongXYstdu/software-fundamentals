<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 482" width="100%" role="img">
<title>JVM 运行时内存结构（JDK 8+）</title>
<desc>堆分新生代与老年代，Metaspace 在本地内存，线程私有区每线程一份，直接内存供 NIO 使用</desc>
<rect x="40" y="60" width="600" height="372" rx="16" fill="none" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="78" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">JVM 进程（-Xmx 只管堆）</text>
<rect x="60" y="92" width="384" height="208" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="252" y="110" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">Java 堆 · 线程共享 · GC 主战场</text>
<rect x="76" y="124" width="178" height="76" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="165" y="148" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">Eden</text>
<text x="165" y="168" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">新对象出生地</text>
<rect x="262" y="124" width="84" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="304" y="148" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">Survivor 0</text>
<text x="304" y="168" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">复制存活</text>
<rect x="354" y="124" width="84" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="396" y="148" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">Survivor 1</text>
<text x="396" y="168" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">age 计数</text>
<rect x="76" y="212" width="362" height="68" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="257" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">老年代 Old</text>
<text x="257" y="256" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">长期对象 · 大对象直入 · Full GC 主区</text>
<rect x="60" y="316" width="384" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="252" y="336" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">Metaspace 元空间</text>
<text x="252" y="356" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">类元数据 · 本地内存 · 不受 -Xmx 限制</text>
<rect x="456" y="92" width="176" height="224" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="544" y="110" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">线程私有 · 每线程一份</text>
<rect x="472" y="124" width="144" height="52" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="544" y="142" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">虚拟机栈</text>
<text x="544" y="160" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">栈帧·局部变量表</text>
<rect x="472" y="184" width="144" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="544" y="202" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">程序计数器</text>
<text x="544" y="218" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">字节码行号</text>
<rect x="472" y="240" width="144" height="52" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="544" y="258" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">本地方法栈</text>
<text x="544" y="276" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">native 调用</text>
<rect x="456" y="316" width="176" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="544" y="336" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">直接内存</text>
<text x="544" y="356" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">NIO DirectBuffer·Netty 用</text>
<text x="340" y="456" text-anchor="middle" font-size="12" fill="#444441" dominant-baseline="central">调参口诀：-Xms = -Xmx 防抖动；MetaspaceSize = MaxMetaspaceSize 防动态扩容触发 Full GC</text>
</svg>