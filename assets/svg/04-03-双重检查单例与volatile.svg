<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 442" width="100%" role="img">
<title>双重检查单例为什么必须 volatile</title>
<desc>new 不是原子操作，可重排序为 1→3→2 导致线程 B 拿到半初始化对象；volatile 禁止重排序根治</desc>
<defs>
<marker id="arrow9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">双重检查单例：为什么必须 volatile</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">new 不是原子操作——可重排序导致半初始化对象逃逸</text>
<rect x="40" y="76" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="98" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">new Singleton()</text>
<text x="110" y="116" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">实际三步</text>
<rect x="190" y="76" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">1 分配内存</text>
<text x="260" y="116" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">malloc</text>
<rect x="340" y="76" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="410" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">2 初始化对象</text>
<text x="410" y="116" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">调构造函数</text>
<rect x="490" y="76" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="565" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">3 赋引用给 instance</text>
<text x="565" y="116" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">store</text>
<line x1="330" y1="104" x2="338" y2="104" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow9)"/>
<line x1="480" y1="104" x2="488" y2="104" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow9)"/>
<rect x="40" y="180" width="290" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="185" y="202" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">正常顺序 1 → 2 → 3</text>
<text x="185" y="222" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">对象完整后才赋引用</text>
<text x="185" y="240" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">线程 B 看到的一定是完整对象</text>
<rect x="350" y="180" width="290" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="495" y="202" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">重排序 1 → 3 → 2</text>
<text x="495" y="222" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">instance 先非空 · 对象未初始化</text>
<text x="495" y="240" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">⚠ 线程 B 可能撞进来</text>
<line x1="565" y1="132" x2="565" y2="160" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="565" y="152" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">CPU/编译器允许</text>
<polyline points="495,260 495,280 185,280 185,298" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow9)"/>
<rect x="40" y="300" width="290" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="185" y="320" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">线程 B 第一次检查</text>
<text x="185" y="340" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">看到 instance ≠ null · 直接返回</text>
<rect x="40" y="370" width="290" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="185" y="388" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">返回半初始化对象</text>
<text x="185" y="404" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">→ 脏值 / NPE</text>
<rect x="350" y="300" width="290" height="118" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="495" y="324" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">解药：volatile instance</text>
<text x="495" y="346" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">禁止 1 → 3 → 2 重排序</text>
<text x="495" y="366" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">保证 store 前对象已初始化</text>
<text x="495" y="386" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">保证可见性（B 立刻看到完整对象）</text>
<text x="495" y="406" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">= 双重检查安全</text>
</svg>