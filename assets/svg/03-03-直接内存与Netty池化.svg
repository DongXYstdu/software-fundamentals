<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="100%" role="img">
<title>直接内存与 Netty 池化</title>
<desc>业务代码经 Netty 池化分配器使用 OS 直接内存，引用计数归零回池，漏 release 则只涨不降</desc>
<defs>
<marker id="arrow7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">直接内存：Netty 网关的隐形战场</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">堆外池化 + 引用计数——用完必须还</text>
<rect x="40" y="76" width="150" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">业务代码</text>
<text x="115" y="116" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">Modbus 编解码</text>
<rect x="220" y="76" width="220" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="330" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">Netty 池化分配器</text>
<text x="330" y="116" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">PooledByteBufAllocator · 按线程分 Arena</text>
<rect x="470" y="76" width="170" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="555" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" dominant-baseline="central">OS 直接内存</text>
<text x="555" y="116" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">malloc/mmap · 不受 -Xmx 管</text>
<line x1="190" y1="106" x2="218" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow7)"/>
<line x1="440" y1="106" x2="468" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow7)"/>
<line x1="330" y1="136" x2="330" y2="164" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow7)"/>
<rect x="220" y="166" width="220" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="330" y="186" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">引用计数</text>
<text x="330" y="204" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">retain(+1) · release(-1)</text>
<text x="330" y="220" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">计数归零 → 回池复用</text>
<polyline points="330,230 330,248 210,248 210,268" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow7)"/>
<polyline points="330,230 330,248 470,248 470,268" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow7)"/>
<rect x="110" y="270" width="200" height="64" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="210" y="290" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">守规矩</text>
<text x="210" y="308" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">try/finally 里 release</text>
<text x="210" y="324" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">内存回池 · 稳态运行</text>
<rect x="370" y="270" width="200" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="470" y="290" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">漏 release</text>
<text x="470" y="308" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">DirectMemory 只涨不降</text>
<text x="470" y="324" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">heap dump 看不见它</text>
<text x="340" y="368" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">监控三件套：-XX:MaxDirectMemorySize 设上限 · NMT（NativeMemoryTracking）· Netty 泄漏检测 paranoid</text>
<text x="340" y="390" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">Vert.x 网关高频收发全走此链路——堆外涨而堆平稳，先查这里</text>
</svg>