<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
<title>接口包归属之争</title>
<desc>集中式 api 包：接口挤一起变更互相牵连；消费者所有：接口跟着使用方走，变更局部化</desc>
<defs>
<marker id="arrow1102" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">接口放哪：集中式 api 包 vs 消费者所有</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">ISP+DIP 在包粒度的落地：接口的方法集合由消费者的需要决定</text>
<rect x="30" y="64" width="300" height="30" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="180" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">❌ 集中式 api 包：变更磁铁</text>
<rect x="50" y="108" width="260" height="84" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="180" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="#4A1B0C" dominant-baseline="central">api/（所有接口集中）</text>
<text x="180" y="146" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">AlarmSink · RuleEvaluator · NotifyChannel</text>
<text x="180" y="166" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">⚠ 改一个签名，依赖 api 的全部重新审视</text>
<text x="180" y="182" text-anchor="middle" font-size="10" fill="#993C1D" dominant-baseline="central">⚠ 接口离开消费者，契约意图丢失</text>
<rect x="70" y="220" width="100" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="241" text-anchor="middle" font-size="10" fill="#444441" dominant-baseline="central">rule 包</text>
<rect x="190" y="220" width="100" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="240" y="241" text-anchor="middle" font-size="10" fill="#444441" dominant-baseline="central">notify 包</text>
<line x1="120" y1="220" x2="150" y2="194" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow1102)"/>
<line x1="240" y1="220" x2="210" y2="194" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow1102)"/>
<text x="180" y="282" text-anchor="middle" font-size="10.5" fill="#993C1D" dominant-baseline="central">所有消费者都挤向同一个包 → 互相牵连</text>
<rect x="350" y="64" width="300" height="30" rx="6" fill="#EAF3EC" stroke="#3B6D11" stroke-width="0.5"/>
<text x="500" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#1F3D0A" dominant-baseline="central">✅ 消费者所有：接口跟着使用方</text>
<rect x="368" y="108" width="124" height="72" rx="8" fill="#EAF3EC" stroke="#3B6D11" stroke-width="1"/>
<text x="430" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="#1F3D0A" dominant-baseline="central">rule/</text>
<text x="430" y="146" text-anchor="middle" font-size="9.5" fill="#1F3D0A" dominant-baseline="central">AlarmRuleEngine（消费者）</text>
<text x="430" y="162" text-anchor="middle" font-size="9.5" fill="#3B6D11" dominant-baseline="central">AlarmSink（它定义的口）</text>
<rect x="508" y="108" width="124" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="570" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">notify/</text>
<text x="570" y="146" text-anchor="middle" font-size="9.5" fill="#444441" dominant-baseline="central">KafkaAlarmSink</text>
<text x="570" y="162" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">implements AlarmSink</text>
<line x1="508" y1="144" x2="494" y2="144" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow1102)"/>
<text x="500" y="200" text-anchor="middle" font-size="10.5" fill="#185FA5" dominant-baseline="central">notify → rule：实现方依赖消费者的接口（倒置）</text>
<text x="500" y="282" text-anchor="middle" font-size="10.5" fill="#3B6D11" dominant-baseline="central">改 AlarmSink 只影响 rule 和它的实现方 · 变更局部化</text>
<text x="340" y="330" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" dominant-baseline="central">分界线：对外契约集中放（发布单元），对内接口归消费者（协作契约）</text>
<text x="340" y="356" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">命名判据：接口名出现具体技术（Kafka/MyBatis）= 所有权放错了地方</text>
</svg>
