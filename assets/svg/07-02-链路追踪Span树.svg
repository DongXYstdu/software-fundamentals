<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" role="img">
<title>链路追踪 Span 树结构</title>
<desc>Trace 是一次完整请求，由多个 Span 组成父子树；SpanContext 跨服务传播</desc>
<defs>
<marker id="arrow13" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">链路追踪：一次请求的 Span 树</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">Trace=完整请求 · Span=操作单元 · SpanContext 跨服务传播</text>
<rect x="270" y="70" width="140" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="88" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">Trace Root</text>
<text x="340" y="106" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">HTTP /iot/data</text>
<rect x="60" y="160" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">Span A</text>
<text x="130" y="198" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">网关解码</text>
<rect x="240" y="160" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="310" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">Span B</text>
<text x="310" y="198" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">解析寄存器</text>
<rect x="420" y="160" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">Span C ⚠</text>
<text x="490" y="198" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">写 TDengine 1.8s</text>
<rect x="60" y="250" width="140" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="130" y="275" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">Span D 更新 Redis</text>
<rect x="420" y="250" width="140" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="275" text-anchor="middle" font-size="11" fill="#4A1B0C" dominant-baseline="central">Span E 告警判定</text>
<line x1="290" y1="120" x2="160" y2="158" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow13)"/>
<line x1="340" y1="120" x2="310" y2="158" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow13)"/>
<line x1="390" y1="120" x2="460" y2="158" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow13)"/>
<line x1="310" y1="216" x2="160" y2="248" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow13)"/>
<line x1="490" y1="216" x2="490" y2="248" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow13)"/>
<text x="340" y="322" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">trace_id 全链唯一 · span_id 父子串联 · 经 HTTP Header / 线程上下文跨服务传播</text>
</svg>