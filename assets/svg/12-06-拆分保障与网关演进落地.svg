<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="100%" role="img">
<title>拆分后保障与网关演进落地</title>
<desc>拆分的代价由保障体系补位，网关单体到多实例的最短路径</desc>
<style>svg{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}</style>
<text x="24" y="30" font-size="15" font-weight="500" fill="#2C2C2A">拆分后的代价 → 保障体系补位（第5段）＋ 你网关的演进落地（第6段）</text>

<rect x="40" y="70" width="470" height="250" rx="12" fill="#EFF6FF" stroke="#2E64A6" stroke-width="1"/>
<text x="275" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#1F4E8C">一旦拆成多服务，失去的单体内建由谁补位</text>
<rect x="60" y="112" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#2E64A6" stroke-width="0.6"/>
<text x="80" y="131" font-size="10.5" fill="#1F4E8C">· 本地事务没了 → 接 L4 分布式事务（你暂不看，点到为止）</text>
<rect x="60" y="146" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#2E64A6" stroke-width="0.6"/>
<text x="80" y="165" font-size="10.5" fill="#1F4E8C">· 直接调用没了 → 服务发现/网关/超时熔断（L4 中间件）</text>
<rect x="60" y="180" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#2E64A6" stroke-width="0.6"/>
<text x="80" y="199" font-size="10.5" fill="#1F4E8C">· 调用链断了 → 可观测性补位（复用 07 三支柱，已学）</text>
<rect x="60" y="214" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#2E64A6" stroke-width="0.6"/>
<text x="80" y="233" font-size="10.5" fill="#1F4E8C">· 接口契约漂移 → API 契约 / 防腐层版本管理</text>
<rect x="60" y="248" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#2E64A6" stroke-width="0.6"/>
<text x="80" y="267" font-size="10.5" fill="#1F4E8C">· 部署爆炸 → 容器化+编排；故障域 → 独立限流隔离</text>
<text x="60" y="300" font-size="10.5" fill="#1F4E8C">→ 结论：每拆一步，必须先把"拆完缺什么"补上，否则只徒增复杂度</text>

<rect x="540" y="70" width="490" height="250" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="785" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A">你的网关：从单体到多实例的最短路径</text>
<text x="560" y="120" font-size="11" fill="#27500A">阶段A · 先模块化（今天）：Vert.x 单体按 BC 拆模块，</text>
<text x="560" y="140" font-size="11" fill="#27500A">　 point/device/alarm 各自成模块，依赖下移、ArchUnit 执法</text>
<text x="560" y="166" font-size="11" fill="#27500A">阶段B · 再独立伸缩（明天）：把"采集"这个高吞吐 BC 拆为</text>
<text x="560" y="186" font-size="11" fill="#27500A">　独立服务，多实例水平扩展，其余低频 BC 保持单体</text>
<text x="560" y="212" font-size="11" fill="#27500A">阶段C · 保障先行（贯穿）：任何一步拆分，都先铺可观测性</text>
<text x="560" y="232" font-size="11" fill="#27500A">　三支柱，再用 L4 的中间件补事务/发现/限流</text>
<text x="560" y="262" font-size="11" fill="#78716C">判据重温：采集服务"改动频率独立 + 需伸缩" → 可拆；</text>
<text x="560" y="282" font-size="11" fill="#78716C">config 服务"强一致 + 低频" → 留在单体最合适</text>
<text x="560" y="302" font-size="11" fill="#27500A">→ 你的合理终态可能是：单体优先，个别 BC 弹性外拆</text>

<rect x="40" y="350" width="990" height="200" rx="12" fill="#F5F5F4" stroke="#E4E4E7" stroke-width="1"/>
<text x="60" y="376" font-size="12" font-weight="500" fill="#2C2C2A">全课串线：六段合成一条决策链</text>
<text x="60" y="402" font-size="11" fill="#3F3F46">① 单体分层 → 够用但业务横切（12-02）</text>
<text x="60" y="424" font-size="11" fill="#3F3F46">② 模块化 → 按业务纵切，依赖用原则+度量执法（12-03，复用 10/11）</text>
<text x="60" y="446" font-size="11" fill="#3F3F46">③ DDD → BC/聚合给出"切对"的判据，仓储/防腐层隔离内外（12-04）</text>
<text x="60" y="468" font-size="11" fill="#3F3F46">④ 推演 → BC 定位候选服务，"独立演进"判据决定拆不拆（12-05）</text>
<text x="60" y="490" font-size="11" fill="#3F3F46">⑤ 保障 → 拆完缺什么补什么，可观测性/契约先行（12-06，复用 07）</text>
<text x="60" y="512" font-size="11" fill="#3F3F46">⑥ 你的网关 → 单体优先 + 采集 BC 弹性外拆的最短路径（12-06）</text>
<text x="60" y="534" font-size="10.5" fill="#78716C">一条主线：每次演进 = 把"堵住的问题"拆出去；先有边界判据，再动切刀，最后补保障。</text>
</svg>