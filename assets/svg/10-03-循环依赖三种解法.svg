<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" role="img">
<title>循环依赖三种解法</title>
<desc>采集↔告警成环：上提抽象（DIP）、合并模块、事件解耦三种拆法前后对比</desc>
<defs>
<marker id="arrow1003" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">拆环三手法：先诊断病因，再选手法</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">环是症状不是病：抽象缺失→上提接口 · 边界切错→合并 · 时序耦合→事件</text>
<rect x="250" y="62" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="340" y="80" text-anchor="middle" font-size="11.5" font-weight="500" fill="#4A1B0C" dominant-baseline="central">病状：采集 ↔ 告警 成环</text>
<text x="340" y="98" text-anchor="middle" font-size="9.5" fill="#993C1D" dominant-baseline="central">采集推快照给告警 · 告警触发后要求加密采集</text>
<rect x="30" y="160" width="196" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="128" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">手法一：上提抽象（DIP）</text>
<rect x="52" y="204" width="66" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="85" y="221" text-anchor="middle" font-size="10" fill="#444441" dominant-baseline="central">采集</text>
<rect x="138" y="204" width="66" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="171" y="221" text-anchor="middle" font-size="10" fill="#444441" dominant-baseline="central">告警</text>
<rect x="76" y="268" width="104" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="128" y="281" text-anchor="middle" font-size="9" fill="#0C447C" dominant-baseline="central">«interface»</text>
<text x="128" y="294" text-anchor="middle" font-size="9" fill="#0C447C" dominant-baseline="central">PollingRateController</text>
<line x1="85" y1="238" x2="110" y2="266" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow1003)"/>
<line x1="171" y1="238" x2="146" y2="266" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow1003)"/>
<text x="128" y="322" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">接口放 domain-core</text>
<text x="128" y="338" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">两模块都依赖抽象 ✓</text>
<rect x="242" y="160" width="196" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">手法二：合并模块（边界纠错）</text>
<rect x="264" y="204" width="66" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="297" y="221" text-anchor="middle" font-size="10" fill="#444441" dominant-baseline="central">模块A</text>
<rect x="350" y="204" width="66" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="383" y="221" text-anchor="middle" font-size="10" fill="#444441" dominant-baseline="central">模块B</text>
<rect x="278" y="268" width="124" height="34" rx="6" fill="#EAF3EC" stroke="#3B6D11" stroke-width="0.8"/>
<text x="340" y="285" text-anchor="middle" font-size="10" font-weight="500" fill="#1F3D0A" dominant-baseline="central">合并为一个模块</text>
<line x1="297" y1="238" x2="320" y2="266" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow1003)"/>
<line x1="383" y1="238" x2="360" y2="266" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow1003)"/>
<text x="340" y="322" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">信号：总一起改·调用点杂</text>
<text x="340" y="338" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">·共享内部结构 → 切错了</text>
<rect x="454" y="160" width="196" height="30" rx="6" fill="#EAF3EC" stroke="#3B6D11" stroke-width="0.5"/>
<text x="552" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#1F3D0A" dominant-baseline="central">手法三：事件解耦（异步）</text>
<rect x="476" y="204" width="66" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="509" y="221" text-anchor="middle" font-size="10" fill="#444441" dominant-baseline="central">告警</text>
<rect x="562" y="204" width="66" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="595" y="221" text-anchor="middle" font-size="10" fill="#444441" dominant-baseline="central">采集</text>
<rect x="490" y="268" width="124" height="34" rx="6" fill="#EAF3EC" stroke="#3B6D11" stroke-width="0.8"/>
<text x="552" y="281" text-anchor="middle" font-size="9" fill="#1F3D0A" dominant-baseline="central">AlarmTriggeredEvent</text>
<text x="552" y="294" text-anchor="middle" font-size="9" fill="#1F3D0A" dominant-baseline="central">发布 ──> 订阅</text>
<line x1="509" y1="238" x2="534" y2="266" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow1003)"/>
<line x1="595" y1="238" x2="570" y2="266" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow1003)"/>
<text x="552" y="322" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">发完即忘，互不相识</text>
<text x="552" y="338" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">适合"事后广播"场景</text>
<line x1="250" y1="118" x2="140" y2="158" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow1003)"/>
<line x1="340" y1="118" x2="340" y2="158" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow1003)"/>
<line x1="430" y1="118" x2="540" y2="158" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow1003)"/>
<text x="340" y="380" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" dominant-baseline="central">选型：要确定性响应 → 接口；只广播事实 → 事件；抽不动的环 → 该合并了</text>
<text x="340" y="404" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">三手法可混用：核心同步协作走接口，旁路通知走事件，切错的合并</text>
</svg>
