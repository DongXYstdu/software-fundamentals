<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" role="img">
<title>条件装配决策流：ModbusAutoConfiguration</title>
<desc>imports 文件发现装配类后，经 ConditionalOnProperty 与 ConditionalOnMissingBean 两道决策，决定容器中是否有 ModbusTcpClient</desc>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">条件装配决策流 · ModbusAutoConfiguration</text>
<text x="340" y="48" text-anchor="middle" font-size="12" fill="#5F5E5A">两道条件门：类级开关 · Bean 级礼让</text>
<g>
<rect x="240" y="66" width="200" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">AutoConfiguration.imports</text>
<text x="340" y="102" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">发现并加载装配类</text>
</g>
<line x1="340" y1="114" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="336,130 340,138 344,130" fill="#5F5E5A"/>
<g>
<polygon points="340,140 470,180 340,220 210,180" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="172" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">@ConditionalOnProperty</text>
<text x="340" y="192" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">modbus.enabled = false ?</text>
</g>
<line x1="470" y1="180" x2="520" y2="180" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="520,176 528,180 520,184" fill="#5F5E5A"/>
<text x="495" y="170" text-anchor="middle" font-size="10" fill="#B3261E">是</text>
<g>
<rect x="530" y="156" width="130" height="48" rx="8" fill="#FCECEC" stroke="#B3261E" stroke-width="0.5"/>
<text x="595" y="174" text-anchor="middle" font-size="12" font-weight="500" fill="#B3261E" dominant-baseline="central">整类跳过</text>
<text x="595" y="192" text-anchor="middle" font-size="11" fill="#B3261E" dominant-baseline="central">0 个 Bean</text>
</g>
<line x1="340" y1="220" x2="340" y2="240" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="336,240 340,248 344,240" fill="#5F5E5A"/>
<text x="352" y="234" font-size="10" fill="#136C43">否 / 未配置（matchIfMissing=true）</text>
<g>
<rect x="230" y="250" width="220" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="268" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">@EnableConfigurationProperties</text>
<text x="340" y="286" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">注册 ModbusProperties 并绑定 yml</text>
</g>
<line x1="340" y1="298" x2="340" y2="314" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="336,314 340,322 344,314" fill="#5F5E5A"/>
<g>
<polygon points="340,324 480,364 340,404 200,364" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="356" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">@ConditionalOnMissingBean</text>
<text x="340" y="376" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">用户已自定义 Client ?</text>
</g>
<line x1="480" y1="364" x2="520" y2="364" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="520,360 528,364 520,368" fill="#5F5E5A"/>
<text x="500" y="354" text-anchor="middle" font-size="10" fill="#996F00">是</text>
<g>
<rect x="530" y="340" width="130" height="48" rx="8" fill="#FAEEDA" stroke="#996F00" stroke-width="0.5"/>
<text x="595" y="358" text-anchor="middle" font-size="12" font-weight="500" fill="#7A5900" dominant-baseline="central">默认装配退让</text>
<text x="595" y="376" text-anchor="middle" font-size="11" fill="#996F00" dominant-baseline="central">用用户的 Bean</text>
</g>
<line x1="340" y1="404" x2="340" y2="424" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="336,424 340,432 344,424" fill="#5F5E5A"/>
<text x="352" y="418" font-size="10" fill="#136C43">否</text>
<g>
<rect x="230" y="434" width="220" height="48" rx="8" fill="#EAF3EC" stroke="#136C43" stroke-width="0.5"/>
<text x="340" y="452" text-anchor="middle" font-size="12" font-weight="500" fill="#136C43" dominant-baseline="central">创建默认 ModbusTcpClient</text>
<text x="340" y="470" text-anchor="middle" font-size="11" fill="#136C43" dominant-baseline="central">注入已绑定的 Properties</text>
</g>
<text x="40" y="490" font-size="11" fill="#8A8880">排查不生效：启动加 --debug 看 Condition Evaluation Report（Positive / Negative matches）</text>
</svg>
