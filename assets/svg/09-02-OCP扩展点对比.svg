<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="100%" role="img">
<title>OCP 扩展点对比</title>
<desc>新增设备型号：if/else 硬编码要改核心类，注册表扩展点只需新增文件</desc>
<defs>
<marker id="arrow902" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">OCP：新增型号——改老代码，还是只写新代码？</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">扩展点 = 接口 + 多实现 + 路由注册表；对扩展开放，对修改关闭</text>
<rect x="30" y="64" width="300" height="30" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="180" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">❌ if/else 硬编码：每次新增都改核心类</text>
<rect x="50" y="110" width="260" height="118" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
<text x="180" y="130" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C" dominant-baseline="central">ModbusParser.parse()</text>
<line x1="62" y1="140" x2="298" y2="140" stroke="#993C1D" stroke-width="0.4"/>
<text x="64" y="158" font-size="11" fill="#5F5E5A" dominant-baseline="central">if "KHE-100" → 老型号解析…</text>
<text x="64" y="178" font-size="11" fill="#5F5E5A" dominant-baseline="central">else if "KHE-200" → 缩放系数…</text>
<text x="64" y="198" font-size="11" fill="#5F5E5A" dominant-baseline="central">else if "KHE-300" → 浮点编码…</text>
<text x="64" y="218" font-size="11" fill="#993C1D" dominant-baseline="central">⚠ 每加一型号，此文件必改</text>
<rect x="90" y="286" width="180" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="180" y="303" text-anchor="middle" font-size="11.5" font-weight="500" fill="#4A1B0C" dominant-baseline="central">新需求：KHE-400 来了</text>
<line x1="180" y1="286" x2="180" y2="232" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow902)"/>
<text x="180" y="262" text-anchor="middle" font-size="10.5" fill="#993C1D" dominant-baseline="central">改老类 → 所有型号全量回归</text>
<rect x="350" y="64" width="300" height="30" rx="6" fill="#EAF3EC" stroke="#3B6D11" stroke-width="0.5"/>
<text x="500" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#1F3D0A" dominant-baseline="central">✅ 注册表扩展点：新增型号 = 新增文件</text>
<rect x="428" y="108" width="144" height="38" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="500" y="121" text-anchor="middle" font-size="10.5" fill="#0C447C" dominant-baseline="central">«interface»</text>
<text x="500" y="137" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">ModelParser</text>
<rect x="356" y="196" width="86" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="399" y="210" text-anchor="middle" font-size="10.5" font-weight="500" fill="#444441" dominant-baseline="central">Khe100</text>
<text x="399" y="226" text-anchor="middle" font-size="10.5" fill="#444441" dominant-baseline="central">Parser</text>
<rect x="457" y="196" width="86" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="210" text-anchor="middle" font-size="10.5" font-weight="500" fill="#444441" dominant-baseline="central">Khe200</text>
<text x="500" y="226" text-anchor="middle" font-size="10.5" fill="#444441" dominant-baseline="central">Parser</text>
<rect x="558" y="196" width="86" height="40" rx="6" fill="#EAF3EC" stroke="#3B6D11" stroke-width="1"/>
<text x="601" y="210" text-anchor="middle" font-size="10.5" font-weight="500" fill="#1F3D0A" dominant-baseline="central">Khe300</text>
<text x="601" y="226" text-anchor="middle" font-size="10.5" fill="#1F3D0A" dominant-baseline="central">Parser ★新</text>
<line x1="399" y1="196" x2="470" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow902)"/>
<line x1="500" y1="196" x2="500" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow902)"/>
<line x1="601" y1="196" x2="530" y2="150" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow902)"/>
<rect x="428" y="286" width="144" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="500" y="300" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">ParserRegistry</text>
<text x="500" y="316" text-anchor="middle" font-size="10" fill="#5F5E5A" dominant-baseline="central">按型号路由 · 写好不再改</text>
<line x1="500" y1="286" x2="500" y2="240" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow902)"/>
<text x="340" y="356" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">验收标准：新增 KHE-300 只新建一个文件，零行老代码修改</text>
<text x="340" y="378" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" dominant-baseline="central">抽象信号：变化第二次出现时才抽接口——不为想象中的需求建注册表</text>
</svg>
