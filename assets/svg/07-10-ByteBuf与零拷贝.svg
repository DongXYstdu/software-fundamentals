<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" role="img">
<title>ByteBuf 内存布局与零拷贝五件套</title>
<desc>读写指针分离三段布局；slice 建视图共享底层内存零复制；五件套按网关场景排序</desc>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">ByteBuf 内存布局与零拷贝</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A">读写指针分离，永远不用 flip()；slice() 只建视图、共享底层内存</text>
<rect x="40" y="70" width="150" height="52" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="92" text-anchor="middle" font-size="12" fill="#444441">已读区</text>
<text x="115" y="110" text-anchor="middle" font-size="10" fill="#5F5E5A">discardable</text>
<rect x="190" y="70" width="250" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="315" y="92" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">可读区（有效数据）</text>
<text x="315" y="110" text-anchor="middle" font-size="10" fill="#185FA5">read 操作消费这里</text>
<rect x="440" y="70" width="200" height="52" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="540" y="92" text-anchor="middle" font-size="12" fill="#444441">可写区</text>
<text x="540" y="110" text-anchor="middle" font-size="10" fill="#5F5E5A">write 操作填充这里</text>
<text x="40" y="140" font-size="10" fill="#5F5E5A">0</text>
<text x="190" y="140" text-anchor="middle" font-size="10" fill="#5F5E5A">readerIndex</text>
<text x="440" y="140" text-anchor="middle" font-size="10" fill="#5F5E5A">writerIndex</text>
<text x="640" y="140" text-anchor="end" font-size="10" fill="#5F5E5A">capacity</text>
<rect x="190" y="156" width="250" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="315" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">slice() 视图：共享底层内存，零复制</text>
<line x1="200" y1="156" x2="200" y2="122" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="430" y1="156" x2="430" y2="122" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect x="40" y="212" width="290" height="52" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="185" y="234" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">传统 copy()</text>
<text x="185" y="252" text-anchor="middle" font-size="10" fill="#5F5E5A">分配新内存，逐字节复制一遍</text>
<rect x="350" y="212" width="290" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="495" y="234" text-anchor="middle" font-size="11" font-weight="500" fill="#27500A">Netty slice()</text>
<text x="495" y="252" text-anchor="middle" font-size="10" fill="#3B6D11">只建一个视图对象，零复制</text>
<rect x="40" y="282" width="600" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="302" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C">零拷贝五件套：slice（切帧最常用）· CompositeByteBuf（逻辑组合）· wrap（包装 byte[]）</text>
<text x="340" y="320" text-anchor="middle" font-size="11" fill="#185FA5">FileRegion（sendfile 磁盘直达网卡）· DirectByteBuf（堆外，省堆→内核复制，呼应 03-03）</text>
<text x="340" y="336" text-anchor="middle" font-size="10" fill="#5F5E5A">两层零拷贝：OS 级 sendfile 免用户态；Netty 级减少 JVM 内复制次数</text>
</svg>
