<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img">
<style>svg{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}</style>
<title>IoC 容器本质：蓝图注册 → 条件过滤 → 实例化装配</title>
<desc>配置源解析为 BeanDefinition 注册进注册表，注册时经过条件评估过滤，refresh 阶段实例化为单例 Bean；BeanFactory 与 ApplicationContext 对照</desc>
<text x="24" y="28" font-size="15" font-weight="500" fill="#2C2C2A">IoC 容器：从配置到对象的四步流水线</text>

<g><rect x="24" y="52" width="150" height="66" rx="8" fill="none" stroke="#A8A29E" stroke-width="0.8"/>
<text x="99" y="76" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">① 配置源</text>
<text x="99" y="94" text-anchor="middle" font-size="9.5" fill="#5F5E5A">@ComponentScan / @Import</text>
<text x="99" y="108" text-anchor="middle" font-size="9.5" fill="#5F5E5A">@Bean 方法 / XML</text></g>
<line x1="174" y1="85" x2="204" y2="85" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="189" y="76" text-anchor="middle" font-size="9" fill="#5F5E5A">解析</text>

<g><rect x="206" y="52" width="170" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="291" y="76" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">② BeanDefinition</text>
<text x="291" y="94" text-anchor="middle" font-size="9.5" fill="#185FA5">蓝图：类名·作用域·懒加载</text>
<text x="291" y="108" text-anchor="middle" font-size="9.5" fill="#185FA5">构造参数·依赖关系</text></g>
<line x1="376" y1="85" x2="406" y2="85" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="391" y="76" text-anchor="middle" font-size="9" fill="#5F5E5A">注册</text>

<g><rect x="408" y="44" width="150" height="82" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3"/>
<text x="483" y="68" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">条件评估关卡</text>
<text x="483" y="86" text-anchor="middle" font-size="9.5" fill="#993C1D">@Conditional 在此判定</text>
<text x="483" y="100" text-anchor="middle" font-size="9.5" fill="#993C1D">不满足 → 蓝图直接丢弃</text>
<text x="483" y="114" text-anchor="middle" font-size="9.5" fill="#993C1D">Bean 根本不会被创建</text></g>
<line x1="558" y1="85" x2="588" y2="85" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="573" y="76" text-anchor="middle" font-size="9" fill="#5F5E5A">通过</text>

<g><rect x="590" y="52" width="146" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="663" y="76" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">③ 注册表</text>
<text x="663" y="94" text-anchor="middle" font-size="9.5" fill="#534AB7">BeanDefinitionRegistry</text>
<text x="663" y="108" text-anchor="middle" font-size="9.5" fill="#534AB7">name → 蓝图 的 Map</text></g>

<path d="M663 118 V150 H390 V178" stroke="#5F5E5A" stroke-width="1.2" fill="none"/>
<text x="520" y="170" text-anchor="middle" font-size="9.5" fill="#5F5E5A">refresh() 预实例化所有非懒加载单例</text>

<g><rect x="290" y="180" width="200" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="390" y="204" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A">④ 单例池 singletonObjects</text>
<text x="390" y="222" text-anchor="middle" font-size="9.5" fill="#3B6D11">实例化 → 装配依赖 → 初始化完成</text></g>

<text x="24" y="280" font-size="13" font-weight="500" fill="#2C2C2A">BeanFactory vs ApplicationContext</text>
<g><rect x="24" y="294" width="350" height="118" rx="8" fill="none" stroke="#A8A29E" stroke-width="0.8"/>
<text x="199" y="316" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">BeanFactory（最小容器）</text>
<text x="199" y="336" text-anchor="middle" font-size="10" fill="#5F5E5A">getBean() 时才实例化（懒加载）</text>
<text x="199" y="352" text-anchor="middle" font-size="10" fill="#5F5E5A">只有 IoC 最基本能力</text>
<text x="199" y="368" text-anchor="middle" font-size="10" fill="#5F5E5A">资源受限场景才直接用</text>
<text x="199" y="392" text-anchor="middle" font-size="10" fill="#5F5E5A">≈ 毛坯房</text></g>
<g><rect x="390" y="294" width="346" height="118" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="563" y="316" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">ApplicationContext（继承并扩展）</text>
<text x="563" y="336" text-anchor="middle" font-size="10" fill="#185FA5">refresh() 时预实例化单例（提前暴露配置错误）</text>
<text x="563" y="352" text-anchor="middle" font-size="10" fill="#185FA5">+ 事件发布 + 国际化 + 资源加载 + Environment</text>
<text x="563" y="368" text-anchor="middle" font-size="10" fill="#185FA5">yudao / 你的网关用的都是它</text>
<text x="563" y="392" text-anchor="middle" font-size="10" fill="#185FA5">≈ 精装房（BeanFactory 是它的地基）</text></g>

<rect x="24" y="428" width="712" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="380" y="449" text-anchor="middle" font-size="11" fill="#3C3489">回填 08-03：条件装配决策流发生在 ②→③ 之间 —— 这就是「--debug 条件报告」里 matched / not matched 的判定时刻</text>
</svg>
