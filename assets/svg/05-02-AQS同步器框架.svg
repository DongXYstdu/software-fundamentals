<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img">
<title>AQS 同步器框架</title>
<desc>state 同步状态 + FIFO 等待队列 + 模板方法模式；子类实现独占或共享获取</desc>
<defs>
<marker id="arrow11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">AQS：所有 JUC 锁的通用骨架</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">volatile state + FIFO 等待队列 + 模板方法</text>
<rect x="250" y="70" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="90" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">state（volatile int）</text>
<text x="340" y="108" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">同步状态 · CAS 修改</text>
<text x="340" y="126" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">0=空闲 · &gt;0=占用</text>
<text x="340" y="148" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">tryAcquire 失败 → 入队阻塞</text>
<rect x="60" y="166" width="100" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="186" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">head</text>
<text x="110" y="204" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">哨兵</text>
<rect x="200" y="166" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="250" y="186" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">Node</text>
<text x="250" y="204" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">线程引用+状态</text>
<rect x="340" y="166" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="390" y="186" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">Node</text>
<text x="390" y="204" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">线程引用+状态</text>
<rect x="480" y="166" width="100" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="186" text-anchor="middle" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">tail</text>
<text x="530" y="204" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">尾指针</text>
<line x1="160" y1="194" x2="198" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow11)"/>
<line x1="300" y1="194" x2="338" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow11)"/>
<line x1="440" y1="194" x2="478" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow11)"/>
<text x="340" y="252" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">FIFO 双向链表 · 前驱唤醒后继</text>
<rect x="160" y="276" width="170" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="245" y="296" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">独占模式</text>
<text x="245" y="316" text-anchor="middle" font-size="11" fill="#0C447C" dominant-baseline="central">ReentrantLock · 写锁</text>
<rect x="350" y="276" width="170" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="435" y="296" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">共享模式</text>
<text x="435" y="316" text-anchor="middle" font-size="11" fill="#27500A" dominant-baseline="central">Semaphore · 读锁 · 闭锁</text>
<text x="340" y="356" text-anchor="middle" font-size="11" fill="#993C1D" dominant-baseline="central">模板方法：子类只写 tryAcquire/tryRelease，AQS 管入队阻塞与唤醒</text>
</svg>