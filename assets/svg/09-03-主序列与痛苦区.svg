<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img">
<title>主序列与痛苦区</title>
<desc>I-A 平面：健康包落在 A+I=1 主序列上；左下痛苦区、右上无用区；网关四包实测落点</desc>
<defs>
<marker id="arrow903" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">主序列：健康的包落在 A + I = 1 上</text>
<text x="340" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central">I = Ce/(Ca+Ce) 不稳定度 · A = 抽象占比 · D = |A+I−1| 距主序列距离</text>
<circle cx="165" cy="300" r="58" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6" stroke-dasharray="4 3"/>
<circle cx="540" cy="112" r="52" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6" stroke-dasharray="4 3"/>
<line x1="90" y1="70" x2="610" y2="330" stroke="#185FA5" stroke-width="1.6"/>
<line x1="90" y1="330" x2="628" y2="330" stroke="#2C2C2A" stroke-width="1.2" marker-end="url(#arrow903)"/>
<line x1="90" y1="330" x2="90" y2="58" stroke="#2C2C2A" stroke-width="1.2" marker-end="url(#arrow903)"/>
<text x="620" y="352" text-anchor="end" font-size="11" fill="#2C2C2A" dominant-baseline="central">I 不稳定度 →</text>
<text x="86" y="70" text-anchor="end" font-size="11" fill="#2C2C2A" dominant-baseline="central">A 抽象度 ↑</text>
<text x="90" y="348" text-anchor="middle" font-size="10" fill="#5F5E5A" dominant-baseline="central">0</text>
<text x="610" y="348" text-anchor="middle" font-size="10" fill="#5F5E5A" dominant-baseline="central">1</text>
<text x="78" y="330" text-anchor="end" font-size="10" fill="#5F5E5A" dominant-baseline="central">0</text>
<text x="78" y="70" text-anchor="end" font-size="10" fill="#5F5E5A" dominant-baseline="central">1</text>
<text x="200" y="86" text-anchor="middle" font-size="11" font-weight="500" fill="#185FA5" dominant-baseline="central">主序列 A + I = 1</text>
<text x="165" y="294" text-anchor="middle" font-size="11" font-weight="500" fill="#993C1D" dominant-baseline="central">⚠ 痛苦区</text>
<text x="165" y="310" text-anchor="middle" font-size="9.5" fill="#993C1D" dominant-baseline="central">被重度依赖却全是具体类</text>
<text x="165" y="324" text-anchor="middle" font-size="9.5" fill="#993C1D" dominant-baseline="central">改一行，全系统回归</text>
<text x="540" y="104" text-anchor="middle" font-size="11" font-weight="500" fill="#5F5E5A" dominant-baseline="central">无用区</text>
<text x="540" y="120" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">一堆接口没人依赖</text>
<text x="540" y="134" text-anchor="middle" font-size="9.5" fill="#5F5E5A" dominant-baseline="central">仪式性抽象，零收益</text>
<circle cx="90" cy="122" r="5" fill="#3B6D11"/>
<text x="102" y="116" font-size="10.5" fill="#1F3D0A" dominant-baseline="central">domain（I=0, A=0.8）✓ 被三方依赖且高抽象</text>
<circle cx="610" cy="304" r="5" fill="#3B6D11"/>
<text x="598" y="296" text-anchor="end" font-size="10.5" fill="#1F3D0A" dominant-baseline="central">collect（I=1.0, A=0.1）✓ 易变实现区</text>
<circle cx="586" cy="278" r="5" fill="#3B6D11"/>
<text x="574" y="270" text-anchor="end" font-size="10.5" fill="#1F3D0A" dominant-baseline="central">alarm（I=1.0, A=0.2）✓</text>
<circle cx="402" cy="317" r="6" fill="#993C1D"/>
<text x="402" y="370" text-anchor="middle" font-size="10.5" fill="#993C1D" dominant-baseline="central">common（I=0.6, A=0.05, D=0.45）⚠ 大杂烩工具包，正滑向痛苦区</text>
<line x1="402" y1="311" x2="402" y2="360" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="340" y="400" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" dominant-baseline="central">越被依赖（I 低）越要抽象（A 高）；干脏活的包（I 高）尽管具体、尽管变</text>
</svg>
